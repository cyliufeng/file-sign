<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件查阅与签到</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{padding:20px;background:#f5f7fa;max-width:600px;margin:0 auto;}
        .box{background:#fff;padding:20px;border-radius:12px;margin-bottom:16px;}
        h2{margin-bottom:16px;color:#222;font-size:18px;}
        .file-item{display:block;padding:12px 14px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;color:#0066cc;text-decoration:none;}
        .file-item:active{background:#f3f4f6;}
        input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:12px;}
        button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:16px;}
        button:active{background:#1d4ed8;}
        .tip{color:#666;font-size:14px;margin-top:8px;}
    </style>
</head>
<body>
<div class="box">
    <h2>📁 文件下载</h2>
    <div id="fileList"></div>
    <div class="tip">CAD、zip压缩包，微信内置浏览器无法下载，请点击链接后选择浏览器打开</div>
</div>

<div class="box">
    <h2>✍️访问签到</h2>
    <input id="username" placeholder="请输入你的姓名">
    <button id="signBtn">提交签到</button>
    <div id="msg" class="tip"></div>
</div>

<script>
// ============修改这里为你自己的Supabase信息============
const SUPABASE_URL = "https://xqskjbqrlhhsrpbfqwsq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GakkCJYaqOtfeccT7a_rvw_tbfnw09w";
// =====================================================

// 修改这里：填写你的文件名称与网盘分享链接
const fileList = [
    {name:"方案文档.pdf", url:"https://飞书网盘链接1"},
    {name:"图纸.dwg", url:"https://飞书网盘链接2"},
    {name:"资料包.zip", url:"https://飞书网盘链接3"}
];

//渲染文件列表
const fileDom = document.getElementById("fileList");
fileList.forEach(f=>{
    const a = document.createElement("a");
    a.className="file-item";
    a.href=f.url;
    a.target="_blank";
    a.innerText = "📄 "+f.name;
    fileDom.appendChild(a);
})

//初始化supabase客户端
const supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const signBtn = document.getElementById("signBtn");
const usernameInput = document.getElementById("username");
const msgDom = document.getElementById("msg");

signBtn.onclick = async function(){
    const name = usernameInput.value.trim();
    if(!name){
        msgDom.innerText="⚠️请填写姓名";
        msgDom.style.color="#dc2626";
        return;
    }
    msgDom.innerText="提交中...";
    msgDom.style.color="#444";
    signBtn.disabled=true;

    const {error} = await supabase.from("sign_record").insert({user_name:name});
    signBtn.disabled=false;
    if(error){
        msgDom.innerText="❌签到失败："+error.message;
        msgDom.style.color="#dc2626";
    }else{
        msgDom.innerText="✅签到成功！";
        msgDom.style.color="#059669";
        usernameInput.value="";
    }
}
</script>
</body>
</html>
